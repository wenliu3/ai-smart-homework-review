# 持续集成：每次 push / PR 自动跑全量测试。
# 后端测试用 per-process sqlite 替换双库，无需任何真实数据库服务。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行自动取消，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend_python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend_python/requirements.txt
            backend_python/requirements-dev.txt
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: 语法检查
        run: python -m compileall -q app
      - name: 全量测试
        run: python -m pytest -q

  frontend:
    name: 前端测试与构建 (vitest + vue-tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单元测试
        run: npx vitest run
      - name: 类型检查与生产构建
        run: npm run build
